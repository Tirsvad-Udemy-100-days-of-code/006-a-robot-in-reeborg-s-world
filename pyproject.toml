[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reeborg-maze"
version = "0.1.0"
description = "Right-wall-following maze solver for Reeborg's world (100 Days of Code, day 6)."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jens Tirsvad Nielsen" }]
keywords = ["reeborg", "maze", "wall-following", "education", "100-days-of-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
# The pasteable script runs in Reeborg's world, which provides these names.
"src/reeborg_maze/presentation/reeborg_script.py" = ["F821", "ANN"]
"tests/**" = ["ANN"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "reeborg_maze.presentation.reeborg_script"
ignore_errors = true

[project.urls]
Repository = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/006-a-robot-in-reeborg-s-world"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reeborg_maze = ["py.typed"]
